<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a7d4ca">
  <title>RANGE ZERO | プロ技 FPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #172a29;
      --paper: #f3f2e8;
      --lime: #d9ef65;
      --coral: #fa6849;
      --mono: "DM Mono", monospace;
      --sans: "Zen Kaku Gothic New", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #a7d4ca; color: var(--ink); font-family: var(--sans); }
    button { color: inherit; font: inherit; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .topline { position: absolute; top: max(20px, env(safe-area-inset-top)); left: 26px; right: 26px; display: flex; justify-content: space-between; align-items: flex-start; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 900; letter-spacing: .04em; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; background: var(--coral); color: white; font: 500 14px var(--mono); }
    .readout { display: flex; gap: 28px; padding: 11px 15px; background: rgba(243, 242, 232, .85); backdrop-filter: blur(8px); }
    .stat { min-width: 62px; }
    .stat-label { display: block; color: #64736a; font: 9px var(--mono); letter-spacing: .12em; }
    .stat-value { display: block; margin-top: 3px; font: 500 19px var(--mono); font-variant-numeric: tabular-nums; }
    .stat-value.timer { color: var(--coral); }
    .crosshair { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); transition: transform .08s ease; }
    .crosshair::before, .crosshair::after { content: ""; position: absolute; left: 50%; top: 50%; background: white; box-shadow: 0 1px 5px #18352e; transform: translate(-50%, -50%); }
    .crosshair::before { width: 2px; height: 22px; }
    .crosshair::after { width: 22px; height: 2px; }
    .crosshair.hit { transform: translate(-50%, -50%) scale(1.6); }
    .crosshair.hit::before, .crosshair.hit::after { background: var(--lime); }
    .bottomline { position: absolute; left: 26px; right: 26px; bottom: max(20px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: end; }
    .hint { color: #fff; text-shadow: 0 1px 5px #18352e; font: 10px var(--mono); letter-spacing: .04em; }
    .hint strong { color: var(--lime); font-weight: 500; }
    .status { padding: 9px 13px; background: var(--lime); font: 10px var(--mono); letter-spacing: .08em; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(17, 43, 40, .28); backdrop-filter: blur(5px); }
    .panel { width: min(460px, 100%); padding: 36px 38px 32px; background: var(--paper); box-shadow: 12px 12px 0 rgba(23, 42, 41, .18); animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .kicker { color: #61796e; font: 11px var(--mono); letter-spacing: .13em; }
    h1 { margin: 12px 0 8px; font-size: clamp(36px, 8vw, 56px); line-height: 1; font-weight: 900; letter-spacing: 0; }
    h1 span { color: var(--coral); }
    .description { margin: 17px 0 24px; color: #53635b; font-size: 13px; line-height: 1.9; }
    .instructions { display: flex; gap: 10px; margin-bottom: 25px; }
    .key { padding: 7px 9px; background: #e2e4d7; color: #41534a; font: 10px var(--mono); }
    .start { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: space-between; padding: 0 17px; border: 0; background: var(--coral); color: white; font-weight: 700; cursor: pointer; transition: background .16s ease, transform .16s ease; }
    .start:hover { background: #dc5035; transform: translateY(-2px); }
    .start:focus-visible, .mobile-controls button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .start-arrow { font: 17px var(--mono); }
    .back { display: inline-block; margin-top: 17px; color: #61796e; font-size: 11px; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .hidden { display: none !important; }
    .mobile-controls { display: none; }
    .mobile-controls button { border: 1px solid rgba(255,255,255,.7); background: rgba(23,42,41,.42); color: white; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pad { position: absolute; left: 16px; bottom: max(72px, calc(env(safe-area-inset-bottom) + 60px)); display: grid; grid-template: repeat(2, 46px) / repeat(3, 46px); gap: 4px; pointer-events: auto; }
    .pad button { font: 14px var(--mono); }
    .pad [data-move="w"] { grid-area: 1 / 2; }
    .pad [data-move="a"] { grid-area: 2 / 1; }
    .pad [data-move="s"] { grid-area: 2 / 2; }
    .pad [data-move="d"] { grid-area: 2 / 3; }
    .fire { position: absolute; right: 22px; bottom: max(88px, calc(env(safe-area-inset-bottom) + 78px)); width: 76px; height: 76px; border-radius: 50%; background: rgba(250,104,73,.8) !important; font-size: 12px; font-weight: 700; pointer-events: auto; }
    @media (pointer: coarse), (max-width: 700px) {
      .topline { left: 14px; right: 14px; top: max(12px, env(safe-area-inset-top)); }
      .readout { gap: 12px; padding: 8px 10px; }
      .stat { min-width: 44px; }
      .stat-value { font-size: 16px; }
      .brand { font-size: 11px; }
      .brand-mark { width: 27px; height: 27px; }
      .bottomline { left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); }
      .hint { max-width: 55%; font-size: 8px; line-height: 1.6; }
      .mobile-controls { display: block; }
      .panel { padding: 28px 24px 24px; }
      .description { font-size: 12px; }
      .instructions { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="3Dターゲット練習場"></canvas>
  <div class="hud" aria-live="polite">
    <div class="topline">
      <a class="brand" href="index.html" style="pointer-events:auto;text-decoration:none"><span class="brand-mark">P</span><span>RANGE ZERO</span></a>
      <div class="readout">
        <div class="stat"><span class="stat-label">TIME</span><span id="timer" class="stat-value timer">45</span></div>
        <div class="stat"><span class="stat-label">SCORE</span><span id="score" class="stat-value">0000</span></div>
        <div class="stat"><span class="stat-label">HITS</span><span id="hits" class="stat-value">00</span></div>
      </div>
    </div>
    <div id="crosshair" class="crosshair" aria-hidden="true"></div>
    <div class="bottomline">
      <div class="hint">AIM <strong>+</strong> FIRE <strong>CLICK</strong><br>MOVE <strong>W A S D</strong> / LOOK <strong>MOUSE</strong></div>
      <div id="status" class="status">READY / 45 SEC</div>
    </div>
  </div>
  <div class="mobile-controls" aria-label="タッチ操作">
    <div class="pad">
      <button type="button" data-move="w" aria-label="前進">↑</button>
      <button type="button" data-move="a" aria-label="左移動">←</button>
      <button type="button" data-move="s" aria-label="後退">↓</button>
      <button type="button" data-move="d" aria-label="右移動">→</button>
    </div>
    <button id="fire" class="fire" type="button">FIRE</button>
  </div>
  <section id="overlay" class="overlay" aria-labelledby="title">
    <div class="panel">
      <div class="kicker">PUROGI FIELD TEST / 001</div>
      <h1 id="title">RANGE<br><span>ZERO</span></h1>
      <p id="description" class="description">45秒のターゲット練習。視点を動かして、光るドローンを狙おう。命中数とスコアを伸ばせ！</p>
      <div class="instructions" aria-label="操作方法"><span class="key">W A S D 移動</span><span class="key">マウス 視点</span><span class="key">クリック 射撃</span></div>
      <button id="start" class="start" type="button"><span>ゲームスタート</span><span class="start-arrow" aria-hidden="true">↗</span></button>
      <a class="back" href="index.html">プロ技トップへ戻る</a>
    </div>
  </section>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

    const canvas = document.querySelector("#scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#a7d4ca");
    scene.fog = new THREE.Fog("#a7d4ca", 36, 105);
    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 1.65, 5);
    camera.rotation.order = "YXZ";
    scene.add(camera);

    scene.add(new THREE.HemisphereLight("#e9fff0", "#616a44", 2.1));
    const sun = new THREE.DirectionalLight("#fff0c4", 2.3);
    sun.position.set(-14, 24, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshStandardMaterial({ color: "#aaba70", roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    const range = new THREE.Group();
    scene.add(range);
    for (const radius of [10, 18, 27]) {
      const mark = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.045, 5, 120), new THREE.MeshBasicMaterial({ color: radius === 18 ? "#f3f2e8" : "#647c53", transparent: true, opacity: 0.7 }));
      mark.rotation.x = Math.PI / 2;
      mark.position.y = 0.025;
      range.add(mark);
    }
    for (let index = 0; index < 18; index++) {
      const angle = index * Math.PI * 2 / 18;
      const radius = 30 + (index % 2) * 2;
      const post = new THREE.Group();
      post.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.22, 3.2, 7), new THREE.MeshStandardMaterial({ color: "#536c50", roughness: 0.78 }));
      stem.position.y = 1.6;
      stem.castShadow = true;
      post.add(stem);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 8), new THREE.MeshStandardMaterial({ color: index % 3 === 0 ? "#fa6849" : "#d9ef65", emissive: index % 3 === 0 ? "#8e2718" : "#65751e", emissiveIntensity: 0.25 }));
      cap.position.y = 3.3;
      post.add(cap);
      range.add(post);
    }
    for (let index = 0; index < 24; index++) {
      const angle = index * 2.399;
      const distance = 38 + (index % 5) * 5;
      const tree = new THREE.Group();
      tree.position.set(Math.cos(angle) * distance, 0, Math.sin(angle) * distance);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 2.1, 6), new THREE.MeshStandardMaterial({ color: "#765e3e" }));
      trunk.position.y = 1.05;
      tree.add(trunk);
      for (let layer = 0; layer < 3; layer++) {
        const crown = new THREE.Mesh(new THREE.ConeGeometry(1.45 - layer * 0.28, 2.25, 7), new THREE.MeshStandardMaterial({ color: layer === 1 ? "#507b58" : "#386b58", roughness: 1 }));
        crown.position.y = 2.3 + layer * 0.9;
        crown.castShadow = true;
        tree.add(crown);
      }
      scene.add(tree);
    }

    const targetMaterial = new THREE.MeshStandardMaterial({ color: "#fa6849", emissive: "#bc321c", emissiveIntensity: 1.5, metalness: 0.2, roughness: 0.28 });
    const ringMaterial = new THREE.MeshStandardMaterial({ color: "#d9ef65", emissive: "#788e18", emissiveIntensity: 1.2, metalness: 0.25, roughness: 0.3 });
    const targetMeshes = [];
    const targets = [];
    const clock = new THREE.Clock();
    const raycaster = new THREE.Raycaster();
    const center = new THREE.Vector2(0, 0);
    const keys = new Set();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    let yaw = 0;
    let pitch = 0;
    let active = false;
    let remaining = 45;
    let score = 0;
    let hits = 0;
    let shots = 0;
    let spawnClock = 0;
    let elapsed = 0;
    let pointerDown = null;

    function spawnTarget() {
      if (targets.length >= 8) return;
      camera.getWorldDirection(forward);
      right.set(1, 0, 0).applyQuaternion(camera.quaternion);
      const distance = 10 + Math.random() * 15;
      const offset = (Math.random() - 0.5) * distance * 1.25;
      const position = camera.position.clone().addScaledVector(forward, distance).addScaledVector(right, offset);
      position.y = 1.7 + Math.random() * 2.4;
      const group = new THREE.Group();
      group.position.copy(position);
      const outer = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.075, 8, 24), ringMaterial);
      const inner = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.055, 8, 24), targetMaterial);
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), new THREE.MeshBasicMaterial({ color: "#fff4bf" }));
      for (const mesh of [outer, inner, core]) {
        mesh.userData.target = group;
        mesh.castShadow = true;
        group.add(mesh);
        targetMeshes.push(mesh);
      }
      group.userData.born = elapsed;
      group.userData.phase = Math.random() * Math.PI * 2;
      group.userData.baseY = position.y;
      scene.add(group);
      targets.push(group);
    }

    function removeTarget(target) {
      scene.remove(target);
      for (const child of target.children) {
        const index = targetMeshes.indexOf(child);
        if (index >= 0) targetMeshes.splice(index, 1);
      }
      const index = targets.indexOf(target);
      if (index >= 0) targets.splice(index, 1);
    }

    function updateHud() {
      document.querySelector("#timer").textContent = String(Math.ceil(remaining)).padStart(2, "0");
      document.querySelector("#score").textContent = String(score).padStart(4, "0");
      document.querySelector("#hits").textContent = String(hits).padStart(2, "0");
    }

    function shoot() {
      if (!active) return;
      shots++;
      raycaster.setFromCamera(center, camera);
      const intersections = raycaster.intersectObjects(targetMeshes, false);
      const target = intersections[0]?.object.userData.target;
      if (target) {
        hits++;
        score += 100;
        removeTarget(target);
        const crosshair = document.querySelector("#crosshair");
        crosshair.classList.add("hit");
        window.setTimeout(() => crosshair.classList.remove("hit"), 120);
      }
      updateHud();
    }

    function endGame() {
      active = false;
      keys.clear();
      document.exitPointerLock?.();
      const accuracy = shots ? Math.round(hits / shots * 100) : 0;
      document.querySelector("#title").innerHTML = "TIME<br><span>UP</span>";
      document.querySelector("#description").textContent = `スコア ${score} 点 / 命中 ${hits} 回 / 命中率 ${accuracy}%。もう一度挑戦して、自己ベストを更新しよう。`;
      document.querySelector("#start").firstElementChild.textContent = "もう一度プレイ";
      document.querySelector("#overlay").classList.remove("hidden");
      document.querySelector("#status").textContent = "ROUND COMPLETE";
    }

    function startGame() {
      score = 0;
      hits = 0;
      shots = 0;
      remaining = 45;
      spawnClock = 0;
      elapsed = 0;
      camera.position.set(0, 1.65, 5);
      yaw = 0;
      pitch = 0;
      camera.rotation.set(0, 0, 0);
      for (const target of [...targets]) removeTarget(target);
      updateHud();
      active = true;
      document.querySelector("#overlay").classList.add("hidden");
      document.querySelector("#status").textContent = "LIVE / 45 SEC";
      if (matchMedia("(pointer: fine)").matches) canvas.requestPointerLock?.();
      spawnTarget();
    }

    document.querySelector("#start").addEventListener("click", startGame);
    document.addEventListener("keydown", (event) => {
      if (["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) event.preventDefault();
      keys.add(event.code);
      if (event.code === "Space") shoot();
    });
    document.addEventListener("keyup", (event) => keys.delete(event.code));
    document.addEventListener("mousemove", (event) => {
      if (!active || document.pointerLockElement !== canvas) return;
      yaw -= event.movementX * 0.0022;
      pitch = THREE.MathUtils.clamp(pitch - event.movementY * 0.0022, -1.35, 1.35);
      camera.rotation.set(pitch, yaw, 0);
    });
    canvas.addEventListener("click", () => {
      if (!active) return;
      if (matchMedia("(pointer: fine)").matches && document.pointerLockElement !== canvas) canvas.requestPointerLock?.();
      else if (document.pointerLockElement === canvas || matchMedia("(pointer: coarse)").matches) shoot();
    });
    canvas.addEventListener("touchstart", (event) => {
      if (!active || event.touches.length !== 1) return;
      pointerDown = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchmove", (event) => {
      if (!active || !pointerDown || event.touches.length !== 1) return;
      const touch = event.touches[0];
      yaw -= (touch.clientX - pointerDown.x) * 0.006;
      pitch = THREE.MathUtils.clamp(pitch - (touch.clientY - pointerDown.y) * 0.006, -1.35, 1.35);
      camera.rotation.set(pitch, yaw, 0);
      pointerDown = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });
    canvas.addEventListener("touchend", () => { pointerDown = null; });
    document.querySelector("#fire").addEventListener("pointerdown", (event) => { event.preventDefault(); shoot(); });
    document.querySelectorAll("[data-move]").forEach((button) => {
      const code = { w: "KeyW", a: "KeyA", s: "KeyS", d: "KeyD" }[button.dataset.move];
      button.addEventListener("pointerdown", (event) => { event.preventDefault(); keys.add(code); button.setPointerCapture(event.pointerId); });
      for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) button.addEventListener(name, () => keys.delete(code));
    });
    window.addEventListener("blur", () => keys.clear());
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      if (active) {
        elapsed += delta;
        remaining -= delta;
        spawnClock += delta;
        if (spawnClock > 0.95) { spawnClock = 0; spawnTarget(); }
        const movement = new THREE.Vector3();
        const moveForward = Number(keys.has("KeyW") || keys.has("ArrowUp")) - Number(keys.has("KeyS") || keys.has("ArrowDown"));
        const moveSide = Number(keys.has("KeyD") || keys.has("ArrowRight")) - Number(keys.has("KeyA") || keys.has("ArrowLeft"));
        movement.set(-Math.sin(yaw) * moveForward + Math.cos(yaw) * moveSide, 0, -Math.cos(yaw) * moveForward + Math.sin(yaw) * moveSide);
        if (movement.lengthSq()) camera.position.addScaledVector(movement.normalize(), delta * 6);
        camera.position.x = THREE.MathUtils.clamp(camera.position.x, -26, 26);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z, -26, 26);
        for (const target of [...targets]) {
          const age = elapsed - target.userData.born;
          target.position.y = target.userData.baseY + Math.sin(age * 2.4 + target.userData.phase) * 0.28;
          target.position.x += Math.sin(age * 1.4 + target.userData.phase) * delta * 0.23;
          target.lookAt(camera.position);
          if (age > 8) removeTarget(target);
        }
        if (remaining <= 0) { remaining = 0; updateHud(); endGame(); }
        else updateHud();
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
